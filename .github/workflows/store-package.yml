name: Microsoft Store Candidate

on:
  workflow_dispatch:

concurrency:
  group: microsoft-store-candidate
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache dependency downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.nuget/packages
            ~/.cargo/registry
            ~/.cargo/git
          key: store-deps-${{ runner.os }}-dotnet-10.0.302-rust-1.96.0-${{ hashFiles('**/packages.lock.json', 'native/Cargo.lock') }}
          restore-keys: |
            store-deps-${{ runner.os }}-dotnet-10.0.302-rust-1.96.0-

      - name: Validate Partner Center identity configuration
        shell: pwsh
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.MICROSOFT_STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($name in @(
              'STORE_PACKAGE_IDENTITY_NAME',
              'STORE_PUBLISHER',
              'STORE_PUBLISHER_DISPLAY_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Repository variable $name is not configured from Partner Center."
            }
          }

      - name: Test and package Microsoft Store candidate
        shell: pwsh
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.MICROSOFT_STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          . ./tools/checked-invocation.ps1
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          Invoke-CheckedScript -Path ./tools/pack-store-msix.ps1 `
            -Arguments @{
              PackageIdentityName = $env:STORE_PACKAGE_IDENTITY_NAME
              Publisher = $env:STORE_PUBLISHER
              PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
              VersionPrefix = $version
              SkipSystemImageSmoke = $true
            } `
            -FailureMessage "Microsoft Store candidate packaging failed"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/QuickLook.Next-Store-*.msix
            artifacts/QuickLook.Next-Store-*.msixupload
            artifacts/QuickLook.Next-Store-*-manifest.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: QuickLook.Next-Microsoft-Store-${{ github.run_number }}
          path: |
            artifacts/QuickLook.Next-Store-*.msix
            artifacts/QuickLook.Next-Store-*.msixupload
            artifacts/QuickLook.Next-Store-*-manifest.json
          if-no-files-found: error
