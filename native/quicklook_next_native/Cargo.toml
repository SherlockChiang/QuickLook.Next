[package]
name = "quicklook_next_native"
version = "1.0.1"
edition = "2021"
description = "QuickLook Next native layer: global hotkey state machine, Explorer selection, Win32/Shell/COM."
license = "MIT"

[lib]
name = "quicklook_next_native"
crate-type = ["cdylib"]

[dependencies]
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = [
    "bzip2",
    "deflate64",
    "deflate-flate2",
    "lzma",
    "time",
    "xz",
    "zstd",
] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
resvg = { version = "0.48", default-features = false, features = ["system-fonts", "text"] }
gif = "0.14"
qcms = { version = "0.3", default-features = false, features = ["iccv4-enabled"] }
getrandom = "0.4"
lopdf = { version = "0.44", default-features = false }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell_PropertiesSystem",
]

[dev-dependencies]
png = "0.18"
# Bounded, reproducible reader properties; no fork/timeout subprocess machinery.
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Fixture writers need AES/Zopfli; production only inspects encryption metadata
# and decodes DEFLATE through flate2. Resolver v2 keeps these out of normal builds.
zip = { version = "8.6", default-features = false, features = ["aes-crypto", "deflate-zopfli"] }
